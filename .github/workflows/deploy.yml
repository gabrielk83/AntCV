# AntCV CI/CD (placeholder)
#
# This workflow is parked. To activate:
#   1. In repo settings, add secrets:
#        CLOUDFLARE_API_TOKEN
#        CLOUDFLARE_ACCOUNT_ID
#   2. Uncomment the deploy-pwa and deploy-workers jobs below.
#   3. Push to main; first run will check the PWA deploys to Pages and the
#      four workers deploy to Workers.

name: AntCV deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanity check repo layout
        run: |
          test -f pwa/index.html
          test -f pwa/sw.js
          test -f workers/proxy/wrangler.toml
          test -f workers/demo-proxy/wrangler.toml
          test -f workers/docx-worker/wrangler.toml
          test -f workers/c2pa-worker/wrangler.toml
          test -f workers/access-relay/wrangler.toml
          test -f workers/antcv-mcp/wrangler.toml
      - name: Confirm observability is on in every wrangler.toml
        run: |
          for f in workers/*/wrangler.toml; do
            grep -q "enabled = true" "$f" && grep -q "invocation_logs = true" "$f" \
              || (echo "missing [observability.logs] in $f" && exit 1)
          done

  deploy-pwa:
    needs: lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Deploy PWA
        run: |
          cd pwa
          wrangler pages deploy . \
            --project-name=antcv \
            --branch=main \
            --commit-message="${{ github.event.head_commit.message }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-workers:
    needs: lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        worker: [proxy, docx-worker, c2pa-worker, access-relay]
    steps:
      - uses: actions/checkout@v4
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Deploy ${{ matrix.worker }}
        run: |
          cd workers/${{ matrix.worker }}
          wrangler deploy
        env:
  #         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  #         CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
