# SECURITY-WEEKLY-001 (owner 2026-06-13): weekly security audit.
# Runs every Monday 08:07 UTC + on demand. scripts/security-audit.mjs exits
# 0 when there are 0 PRODUCTION vulnerabilities (dev-only advisories are
# reported, not failed) and exits 2 on a production vulnerability or any
# CRITICAL advisory. A non-zero exit fails the run -> visible to the admin
# on GitHub; the policy (docs/security/SECURITY_UPDATE_POLICY.md) then
# requires immediate email + SMS (+45 31710072) escalation and approval.
name: Weekly security audit

on:
  schedule:
    - cron: "7 8 * * 1" # Monday 08:07 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install (no scripts)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run weekly security audit
        id: audit
        run: node scripts/security-audit.mjs 2>&1 | tee audit.txt
      - name: Notify admin (only on a production / critical finding)
        if: failure()
        env:
          # PREFERRED: reuse the relay's existing Resend key (login sequence).
          # Set SECURITY_ALERT_URL = https://<relay>/api/security-alert and a
          # shared SECURITY_ALERT_TOKEN (also set on the relay). No Resend key
          # needed in GitHub.
          SECURITY_ALERT_URL: ${{ secrets.SECURITY_ALERT_URL }}
          SECURITY_ALERT_TOKEN: ${{ secrets.SECURITY_ALERT_TOKEN }}
          # Fallbacks (optional): direct Resend / Twilio.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SEC_FROM_EMAIL: ${{ secrets.SEC_FROM_EMAIL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
        run: |
          echo "::error::PRODUCTION vulnerability or CRITICAL advisory found — escalating to admin."
          node scripts/security-notify.mjs "$(cat audit.txt | tail -n 20)"
