  <!-- v1.40.303: antcv-wizard-startup-clear-300.js removed (and its
       duplicate near the rest of the shim chain). It was a band-aid
       for the rogue wizardCompleted writers in wizard-fix-297 and
       ai-wizard-slide-239, which have also been removed. The bundle's
       gate at app.js bytes 210050 / 217398 is sufficient on its own,
       once nothing else writes the flag at module-init time. -->
  <!-- Mammoth (.docx text extractor) loads lazily on first .docx upload, like JSZip and PDF.js.
       v0.98.3: ~700KB previously eager; now deferred to first use. -->
  <script>window.loadMammoth=()=>new Promise((res,rej)=>{if(window.mammoth)return res(window.mammoth);const s=document.createElement('script');s.src='https://unpkg.com/mammoth/mammoth.browser.min.js';s.onload=()=>res(window.mammoth);s.onerror=()=>rej(new Error('Failed to load Mammoth (.docx parser)'));document.head.appendChild(s);});</script>
  <!-- JSZip loads lazily from exportDocx when needed, so the app boots fast. -->
  <script>window.loadJSZip=()=>new Promise((res,rej)=>{if(window.JSZip)return res(window.JSZip);const s=document.createElement('script');s.src='https://unpkg.com/jszip@3.10.1/dist/jszip.min.js';s.onload=()=>res(window.JSZip);s.onerror=()=>rej(new Error('Failed to load JSZip'));document.head.appendChild(s);});</script>
  <!-- PDF.js loads lazily on first PDF upload — robust client-side extraction with no API call needed.
       v23: switched from 4.0.379 (ES-module-only, no UMD build at that path) to 3.11.174 (last stable
       3.x, UMD build available on all major CDNs). Added multi-CDN fallback chain so a single CDN
       outage or path change can't kill PDF parsing. -->
  <script>
    window.loadPDFJS=()=>new Promise((res,rej)=>{
      if(window.pdfjsLib) return res(window.pdfjsLib);
      const ver='3.11.174';
      const cdns=[
        `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${ver}/pdf.min.js`,
        `https://cdn.jsdelivr.net/npm/pdfjs-dist@${ver}/build/pdf.min.js`,
        `https://unpkg.com/pdfjs-dist@${ver}/build/pdf.min.js`
      ];
      const workerUrls=[
        `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${ver}/pdf.worker.min.js`,
        `https://cdn.jsdelivr.net/npm/pdfjs-dist@${ver}/build/pdf.worker.min.js`,
        `https://unpkg.com/pdfjs-dist@${ver}/build/pdf.worker.min.js`
      ];
      let idx=0;
      const tryNext=()=>{
        if(idx>=cdns.length){
          return rej(new Error('Failed to load PDF.js from all 3 CDNs (cdnjs, jsdelivr, unpkg). Check your connection or firewall — these are unblocked on most networks.'));
        }
        const s=document.createElement('script');
        s.src=cdns[idx];
        s.onload=()=>{
          try{
            window.pdfjsLib.GlobalWorkerOptions.workerSrc=workerUrls[idx];
            console.log('[AntCV] PDF.js loaded from', cdns[idx]);
            res(window.pdfjsLib);
          }catch(e){rej(e);}
        };
        s.onerror=()=>{
          console.warn('[AntCV] PDF.js CDN failed:', cdns[idx]);
          idx++;
          tryNext();
        };
        document.head.appendChild(s);
      };
      tryNext();
    });
  </script>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
    body{font-family:'Georgia',serif;background:#283556;overscroll-behavior:none;}
    #root{min-height:100dvh;}
    textarea,input,select,button{font-family:inherit;}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-thumb{background:#01B7BB55;border-radius:2px;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .fade{animation:fadeIn .3s ease;}

    /* WCAG 2.1 AA: visible keyboard focus indicators for all
       interactive elements. Sites that suppress :focus entirely
       (with outline:none and no replacement) fail SC 2.4.7. We
       keep our designed look by using :focus-visible (mouse
       clicks suppressed, keyboard focus shown) and a 2.5px ring
       in our brand teal with a 1px white inset for visibility on
       both navy and white backgrounds. */
    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    [role="button"]:focus-visible,
    [tabindex]:focus-visible {
      outline: 2.5px solid #01B7BB !important;
      outline-offset: 2px !important;
      box-shadow: 0 0 0 1px #fff inset, 0 0 0 4px rgba(1,183,187,0.35) !important;
    }
    /* Mouse-click focus stays unobtrusive — only keyboard focus
       gets the high-visibility ring. */
    :focus:not(:focus-visible) { outline: none; }

    /* WCAG 2.4.1 Bypass Blocks — skip link to main content for
       screen-reader and keyboard users. Hidden until focused. */
    .antcv-skip-link {
      position: absolute; top: -100px; left: 8px; z-index: 99999;
      background: #00746E; color: #fff; padding: 10px 16px;
      border-radius: 6px; font-weight: 700; font-size: 14px;
      text-decoration: none; font-family: Calibri, Arial, sans-serif;
    }
    .antcv-skip-link:focus { top: 8px; outline: 2.5px solid #fff; }

    /* WCAG 2.3.3 / SC 2.2.2: respect prefers-reduced-motion.
       Users who set this OS preference get static UI instead of
       fades, slides, and spins. The spinner becomes a static dot. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    /* Print: visible AI-assisted footer line uses rgba alpha. By
       default browsers may strip alpha for print to favour ink
       legibility; force the exact composited colour through. */
    @media print {
      [data-antcv-ai-disclosure="visible"] {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }

    /* v1.40.115: during sidebar/table drag, the JS handler adds
       `.antcv-dragging` to <html>. These rules force ew-resize cursor
       on every descendant — winning over `cursor:text` on
       contenteditable and other element-specific cursor declarations
       that would otherwise flicker the cursor mid-drag. Also disables
       text selection so cross-element drags don't start a selection. */
    html.antcv-dragging, html.antcv-dragging *,
    html.antcv-dragging [contenteditable="true"] {
      cursor: ew-resize !important;
      user-select: none !important;
      -webkit-user-select: none !important;
    }

    /* v1.40.120: when the kernel showcase banner is visible at the
       top of the viewport, push body content down so it isn't
       covered. Without this the banner overlapped the topbar and
       any buttons below it. The 52px matches the banner's height
       (10px padding + 18px spinner + 4px progress bar + ~16px
       label + 10px padding \u2248 52px) and leaves a small visual
       gap below the bottom border. */
    body.antcv-banner-active {
      padding-top: 52px !important;
    }
    body.antcv-banner-active > div[role="alert"],
    body.antcv-banner-active > div[role="status"] {
      /* For full-width alert/status bars rendered by React at the
         top of the document tree, shift them down too so they
         don't visually merge with the banner above. */
      margin-top: 0 !important;
    }

    /* v1.40.116: blanket-hide every floating UI element from print.
       Gabriel reported that some circular FAB buttons (refresh /
       graduation cap / fusion CL-CV) were showing up in CTRL+P print
       preview. The originating components are spread across overlay
       JS modules and don't all have `.no-print`. This rule catches
       them by their common pattern: position:fixed circular elements
       in the bottom-right region of the viewport. It also reinforces
       existing `.no-print` declarations for buttons that already had
       one. Safe at print time because nothing about the printed
       document should be interactive. */
    @media print {
      .no-print, [class*="no-print"] { display: none !important; }
      /* Catch overlay/FAB buttons that lack a no-print class. */
      .antcv-fab, [class*="antcv-fab"],
      .antcv-overlay, [class*="antcv-overlay"],
      .antcv-mc-action, [class*="antcv-mc-action"] {
        display: none !important;
      }
      /* Catch any circular floating element near the viewport edges. */
      body > div[style*="position: fixed"][style*="bottom"],
      body > div[style*="position:fixed"][style*="bottom"] {
        display: none !important;
      }
    }

    /* v128: Gesture priority hierarchy (per UX spec):
       1. UI controls (buttons, sliders) — manipulation (no double-tap zoom delay)
       2. Editable text — auto (native edit / selection, double-tap)
       3. Single-finger vertical — native scroll (never intercepted)
       4. Single-finger horizontal — pan only when zoomed >100% (handled in JS)
       5. Two fingers — pinch zoom (handled in JS)
       The previous rule blanket-applied touch-action:none and user-select:none
       to every preview node, which made vertical scroll, double-tap, and
       text editing unreliable in the "red areas". */
    .antcv-preview-scroll{
      /* Scroller: allow native vertical scroll + pinch. The capture-phase
         JS handler takes over for two-finger pinch and for horizontal pan
         when zoomed; a single-finger vertical drag releases to the browser. */
      touch-action: pan-x pan-y;
      -webkit-overflow-scrolling: touch;
    }
    .antcv-preview-wrap, .antcv-preview-paper{
      /* Wrappers don't intercept anything — let events reach editable text. */
      touch-action: auto;
    }
    .antcv-preview-paper [contenteditable="true"]{
      /* In edit mode: native selection, caret, double-tap-to-select. */
      -webkit-user-select: text;
      user-select: text;
      cursor: text;
      pointer-events: auto;
    }
    .antcv-preview-paper [data-antcv-editable-text="true"]:not([contenteditable="true"]){
      /* Outside edit mode: prevent text selection so touches over text
         release cleanly to the gesture handler (scroll / pinch). The
         previous rule applied user-select:text to ALL editable markers,
         which caused Android to start a text-selection gesture on every
         touch over the name/specialisation/contact line — preempting
         both scroll and pinch zoom. */
      -webkit-user-select: none;
      user-select: none;
    }
    .antcv-preview-actions, .antcv-preview-actions *,
    .antcv-react-bottom-nav, .antcv-react-bottom-nav *{
      /* Buttons must always be tappable, never blocked by gesture handlers. */
      touch-action: manipulation;
    }
    @media (max-width: 900px){
      .antcv-preview-actions .antcv-export-buttons{
        transform:none!important;
      }
    }
    .antcv-col-splitter{
      transition: background 120ms ease-out;
      /* Hit zone is 56px wide (set inline) for finger-friendly drags
         even after the preview is scaled down on mobile. The visible
         grip is a centered teal pill rendered via ::before — large
         enough to spot, narrow enough not to overlap content. */
      background: transparent !important;
      display: flex; align-items: center; justify-content: center;
    }
    .antcv-col-splitter::before{
      content: '';
      width: 6px;
      height: 32px;
      background: rgba(1,183,187,0.55);
      border: 1px solid rgba(1,183,187,0.85);
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.18);
      pointer-events: none;
      /* Three subtle horizontal grip notches via inset shadows */
      background-image: linear-gradient(
        to bottom,
        transparent 0%, transparent 28%,
        rgba(255,255,255,0.55) 28%, rgba(255,255,255,0.55) 36%,
        transparent 36%, transparent 46%,
        rgba(255,255,255,0.55) 46%, rgba(255,255,255,0.55) 54%,
        transparent 54%, transparent 64%,
        rgba(255,255,255,0.55) 64%, rgba(255,255,255,0.55) 72%,
        transparent 72%, transparent 100%
      );
    }
    .antcv-col-splitter:hover::before,
    .antcv-col-splitter:active::before{
      background-color: rgba(1,183,187,0.9);
      border-color: rgba(0,116,110,1);
      width: 8px;
    }
    @media print{
      /* Always hide UI chrome regardless of mode */
      .no-print{display:none!important;}
      .app-root .no-print{display:none!important;}

      /* When the user uses the dedicated PDF export, the app sets
         body.antcv-printing-cv before invoking print. Only then do we
         force the preview-only layout. For plain Ctrl+P / browser print
         this class is not set, so the page prints what's visible
         instead of producing a blank navy sheet. */
      body.antcv-printing-cv > #root > * {display:none!important;}
      body.antcv-printing-cv > #root > .app-root { display:block!important; }
      body.antcv-printing-cv .app-root .preview-print-area{display:block!important;}

      .print-wrap{position:fixed;top:0;left:0;width:100%;height:100%;overflow:auto;background:#fff;}
      /* v1.05: the CV preview wraps the sidebar + main column in
         display:flex. Browsers cannot paginate flex containers across
         pages — they treat flex children as atomic, which is why the
         whole experience block jumps to a new physical page instead of
         splitting between roles. Convert to a table layout for print
         only; the children's pageBreakInside:avoid then works as
         intended and the section splits between role boundaries. */
      .antcv-page-row{
        display:table!important;
        width:100%!important;
        table-layout:fixed!important;
      }
      .antcv-page-row > .antcv-document-sidebar,
      .antcv-page-row > .antcv-document-main{
        display:table-cell!important;
        vertical-align:top!important;
        float:none!important;
        /* v1.14: kill the on-screen minHeight (400px page-1, 300px later)
           in print. The pixel min keeps the navy sidebar looking
           visually substantial on screen even when content is sparse,
           but in print it forces the table-row to be at least that
           tall, which after browser pagination tends to push trailing
           whitespace onto an extra blank page. Letting the row
           collapse to its content height in print eliminates the
           ghost pages. */
        min-height:0!important;
        /* v1.40.19: allow content INSIDE each cell to split across pages.
           Default for table-cell is `break-inside:avoid` in some
           browsers, which keeps the whole cell on one page; when the
           sidebar is taller than what fits, the row is pushed forward,
           creating a blank page above. `auto` lets the column flow
           naturally. */
        page-break-inside:auto!important;
        break-inside:auto!important;
      }
      /* v1.40.19: the page-row itself also needs to allow internal
         breaking — some Chromium versions treat `display:table` as
         atomic for pagination unless this is explicit. */
      .antcv-page-row{
        page-break-inside:auto!important;
        break-inside:auto!important;
      }
      /* Honor section.pageBreakBefore=true (set e.g. by the
         "Append to cover letter" flow on the jd_questions section)
         even when only the legacy webkit prefix is present. */
      [style*="page-break-before:always"],
      [style*="break-before:page"]{
        page-break-before:always!important;
        break-before:page!important;
      }
    }
  </style>

<!-- v128: External DOCX worker client. Set window.ANTCV_DOCX_WORKER to your
     deployed worker URL to use the new strict-Word-compliant pipeline.
     Leave it unset to keep using the legacy inline pipeline.
     v1.40: hydrate from localStorage at boot so users can configure
     routing inside the PWA (Settings → Advanced → Routing) without
     re-editing index.html. -->
<script>
  (function hydrateDocxWorker(){
    function isUsable(u){
      if (!u) return false;
      try {
        var p = new URL(u);
        if (p.protocol !== 'https:') return false;
        if (p.hostname === location.hostname) return false;
        if (/\.pages\.dev$/i.test(p.hostname)) return false;
        return true;
      } catch(_) { return false; }
    }
    try {
      var v = localStorage.getItem('docxWorkerUrl') || localStorage.getItem('antcv:docxWorker') || localStorage.getItem('antcvDocxWorker') || '';
      if (v && v.charAt(0)==='"' && v.charAt(v.length-1)==='"') v = v.slice(1,-1);
      v = (v || '').replace(/\/+$/, '');
      // v1.40.14: clean-install default so users don't have to hunt for the URL
      if (!v) v = 'https://docx-worker.karp-gabriel-a.workers.dev';
      if (isUsable(v)) {
        window.ANTCV_DOCX_WORKER = v;
        try { localStorage.setItem('docxWorkerUrl', v); localStorage.setItem('antcvDocxWorker', JSON.stringify(v)); localStorage.setItem('antcv:docxWorker', v); } catch(_) {}
      }
    } catch(_) {}
  })();
</script>

<script>
  // ===========================================================================
  // v1.38: relay URL is now loaded from relay-config.json at boot time.
  //
  // Deploy workflow:
  //   1. Edit relay-config.json — change "relay" to your real Cloudflare
  //      Worker URL (the one running antcv-relay-auth).
  //   2. Drop it alongside this index.html in your Cloudflare Pages deploy.
  //
  // If relay-config.json is missing or malformed, an admin-only error
  // appears in the browser console. End users see a clean "service
  // unavailable" message — never internal config language.
  //
  // The localStorage `proxyUrl` (set by the wizard's "Own Cloudflare
  // Worker" path) always takes precedence over this file.
  // ===========================================================================
  (function bootAntCV() {
    function loadAppScripts(){
      // v1.40.195: shape-guard MUST load before app.js so the first
      // React render sees a clean `sections` shape (fixes the
      // "Cannot read properties of undefined (reading 'bullets')"
      // crash on language switch back from zh/es to en).
      // v1.40.198: version-override is loaded AFTER app.js so it
      // can re-pin window.ANTCV_VERSION (app.js bakes its own
      // version constant and overwrites our value during init).
      var shapeGuard = document.createElement('script');
      shapeGuard.src = 'antcv-shape-guard.js?v=1.40.202';
      shapeGuard.onload = function(){
        var auth = document.createElement('script');
        auth.src = 'antcv-auth.js?v=1.40.202';
        auth.onload = function(){
          var app = document.createElement('script');
          app.src = 'app.js?v=1.40.339';
          app.onload = function(){
            // v1.40.198: re-assert version after app.js has set
            // its baked-in constant. The sidecar uses
            // Object.defineProperty + a polling timer to keep it
            // pinned even against repeat assignments.
            var vo = document.createElement('script');
            vo.src = 'antcv-version-override.js?v=1.40.339';
            document.head.appendChild(vo);
          };
          document.head.appendChild(app);
        };
        document.head.appendChild(auth);
      };
      document.head.appendChild(shapeGuard);
    }

    fetch('relay-config.json', { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('HTTP_'+r.status); return r.json(); })
      .then(function(j){
        var raw = (j && typeof j.relay === 'string') ? j.relay.trim().replace(/\/+$/, '') : '';
        if (raw && raw.indexOf('https://') === 0 && raw.indexOf('REPLACE_WITH_YOUR') < 0) {
          window.ANTCV_RELAY_URL = raw;
        } else {
          window.ANTCV_RELAY_CONFIG_ERROR = 'invalid_relay_in_config';
          console.error('[AntCV admin] relay-config.json has no valid "relay" URL. Edit relay-config.json to point at your deployed AntCV relay-auth Worker URL, then redeploy.');
        }
      })
      .catch(function(e){
        window.ANTCV_RELAY_CONFIG_ERROR = String((e && e.message) || e);
        console.error('[AntCV admin] relay-config.json could not be loaded:', e, '\\nMake sure relay-config.json is deployed alongside index.html, and contains a valid JSON object like:\\n  {"relay": "https://your-relay.workers.dev"}');
      })
      .finally(loadAppScripts);
  })();
</script>

<script>
(function(){
  async function clearAntcvHardReset(opts){
    opts=opts||{};

    // The PWA's cloudWrite reads this flag via _antcvJustErased() and refuses
    // to fire outgoing PUTs while it's set. Without this, an already-queued
    // cloudWrite (e.g. closeWiz's `cloudWrite({wizardCompleted: true})` with

    // PUT (we see cloudWrite issuing sparse PUTs like `{proxyUrl: ""}` and
    // expecting other fields preserved), and a `null` value is likely either
    // rejected as type-invalid or merged as "no change". Either way, the
    // cloud `personalInfo` survived, and on the next sign-in `cloudRead()`
    // wrote it straight back to localStorage. That's the data leak the user
    // saw in the wizard's "Tell AntCV about you" step.
    //
    // Two defenses, applied together:

    //      empty-state object for every persisted field — empty objects, not

      // are the type the relay would accept (strings/objects/arrays, never
      // null). If new fields are added to cloudWrite later, add them here too.
      var EMPTY_STATE={
        proxyUrl:'',
        photo:'',
        apiKeys:{anthropic:'',openai:'',mistral:'',gemini:''},
        personalInfo:{
          name:'',firstName:'',lastName:'',headline:'',
          city:'',country:'',location:'',citizenship:'',
          email:'',phone:'',landline:'',linkedin:'',github:'',website:'',
          contactExtra:[],patentNumber:'',patentDescription:'',
          publications:[],background:'',
          tools:[],certifications:[],education:[],regulatory:[],additional:[],
          stylePrefs:{banned_words:'',banned_phrases:'',preferred_tone:''}
        },
        sections:{cv:[],cl:[]},
        meta:{},
        rationale:{},
        headerItemLoc:{},
        wizardCompleted:false,
        // v1.40.45 leak fix: the LLM-derived doc blobs (memoryDigest,
        // profileDoc, skillsDoc, danishDoc, wordsDoc, memoryDigestHash)
        // are pulled from cloud KV on cloudRead. If a prior generation
        // wrote contaminated content into one of them, cloudRead would
        // re-pollute local state on the next sign-in even after a
        // local-only wipe. Sending these as empty strings forces the
        // relay to overwrite the cloud copy too. The relay PUT
        // allow-list in handleApiPrefs accepts these as of v2.6.
        memoryDigest:'',
        memoryDigestHash:'',
        profileDoc:'',
        skillsDoc:'',
        danishDoc:'',
        wordsDoc:'',
        // Belt-and-suspenders: an explicit deletion timestamp the relay can
        // log even if it doesn't act on it.
        _erasedAt:new Date().toISOString()

      try{
        await withTimeout(
          fetch(base+'/api/prefs',{method:'DELETE',credentials:'include'}).catch(function(e){return{_err:e}}),
          2000
        );
      }catch(e){}
      // 2) Unconditional PUT with the fully-typed empty state. This runs
      //    REGARDLESS of whether the DELETE succeeded — if the relay's KV
      //    is eventually consistent or DELETE is unsupported, the PUT
      //    overwrites every known field with its empty value.
      try{
        await withTimeout(
          fetch(base+'/api/prefs',{
            method:'PUT',credentials:'include',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify(EMPTY_STATE)
          }).catch(function(){return null}),
          2000
        );
      }catch(e){}
      // 3) POST /auth/logout — invalidates the JWT server-side. Path is
      //    /auth/logout (matches antcv-auth.js signOut), NOT /logout.
      try{
        await withTimeout(
          fetch(base+'/auth/logout',{method:'POST',credentials:'include'}).catch(function(){return null}),
          2000
        );
      }catch(e){}
      // 4) v1.40.45: cascade-delete D1 kernel rows. The PUT-empty above
      //    only touches KV; D1 (user_kernel, application, active_application)
      //    is on a separate code path. Without this call a user who has
      //    deleted everything in the PWA still has D1 rows under their
      //    hashed email, and on next sign-in the kernel-extraction
      //    endpoints would surface that stale data. Best-effort —
      //    failure here does not block the local wipe.
      try{
        await withTimeout(
          fetch(base+'/api/profile/kernel',{method:'DELETE',credentials:'include'}).catch(function(){return null}),
          2000
        );
      }catch(e){}
    }
    // Set a marker so the next signin's cloudRead can refuse to overwrite
    // local state if cloud-eventual-consistency hasn't propagated yet.
    // sessionStorage is scoped to the tab and survives reload — exactly
    // what we want.

    // Total local wipe — no exceptions
    try{ localStorage.clear(); }catch(e){}
    try{ sessionStorage.clear(); }catch(e){}
    // Set the just-erased marker AFTER sessionStorage.clear() so it survives
    // the wipe and is visible to the next page load. The next-load hook in
    // app.js (cloudRead) checks this and refuses to write any cloud-returned
    // personalInfo / sections back to localStorage for the first 30 seconds,
    // covering Cloudflare KV's eventual-consistency window.
    try{ sessionStorage.setItem('antcv:just-erased', String(Date.now())); }catch(e){}

      document.cookie.split(';').forEach(function(c){
        var name=c.replace(/^ +/,'').split('=')[0];
        if(!name) return;
        document.cookie=name+'=;expires='+new Date(0).toUTCString()+';path=/';

    try{
      if('caches' in window){
        var keys=await caches.keys();
        await Promise.all(keys.map(function(k){return caches.delete(k)}));
      }
    }catch(e){}

      if('serviceWorker' in navigator){
        var regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(function(r){return r.unregister()}));
      }

    await new Promise(function(r){setTimeout(r,150)});
    try{ location.reload(); }catch(e){ try{ location.replace(location.origin+location.pathname); }catch(_){} }
  }

    var p=new URLSearchParams(location.search);
    if(p.get('hardReset')==='1'){
      clearAntcvHardReset({target:location.origin+location.pathname});
    }
  }catch(e){}
})();
</script>

<!-- v1.40.290: Kernel-generation completeness guard (supersedes v289).
     v289 caught fully-empty array failures but let through a more
     subtle failure mode: the LLM filled items 1..N of each array but
     left item 0 as the bracketed template, and put placeholders in
     every prose field too. The bundle's "5/5 critical CL fields"
     check accepted it (placeholders are non-empty), then _scrubRole
     crashed iterating role 0's malformed bullet shape → blue screen.
     v290 changes:
       - Strict mode: ANY placeholder in any array element or prose
         field rejects the whole response (not threshold-based).
       - Prose field coverage: profile_content, opening_content,
         who_content, why_content, foundation_*, closure_content,
         contribute_intro, contribute_closing all validated.
       - Persistent augmentation: the prompt addendum is re-applied
         on every retry within the 30s window (v289 was one-shot),
         and the addendum names "item 0 / row 1" as the observed
         failure pattern.
       - Part C defensive scrubber: any placeholder string that
         somehow survives validation is mutated to empty string in
         place before the parsed object reaches app.js — empty is
         safe downstream, bracketed placeholders crash _scrubRole. -->
