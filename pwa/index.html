  <script>
    window.loadPDFJS=()=>new Promise((res,rej)=>{
      if(window.pdfjsLib) return res(window.pdfjsLib);
      const ver='3.11.174';
      const cdns=[
        `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${ver}/pdf.min.js`,
        `https://cdn.jsdelivr.net/npm/pdfjs-dist@${ver}/build/pdf.min.js`,
        `https://unpkg.com/pdfjs-dist@${ver}/build/pdf.min.js`
      ];
      const workerUrls=[
        `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${ver}/pdf.worker.min.js`,
        `https://cdn.jsdelivr.net/npm/pdfjs-dist@${ver}/build/pdf.worker.min.js`,
        `https://unpkg.com/pdfjs-dist@${ver}/build/pdf.worker.min.js`
      ];
      let idx=0;
      const tryNext=()=>{
        if(idx>=cdns.length){
          return rej(new Error('Failed to load PDF.js from all 3 CDNs (cdnjs, jsdelivr, unpkg). Check your connection or firewall.'));
        }
        const s=document.createElement('script');
        s.src=cdns[idx];
        s.onload=()=>{
          try{
            window.pdfjsLib.GlobalWorkerOptions.workerSrc=workerUrls[idx];
            console.log('[AntCV] PDF.js loaded from', cdns[idx]);
            res(window.pdfjsLib);
          }catch(e){rej(e);}
        };
        s.onerror=()=>{
          console.warn('[AntCV] PDF.js CDN failed:', cdns[idx]);
          idx++;
          tryNext();
        };
        document.head.appendChild(s);
      };
      tryNext();
    });
  </script>

  (function hydrateDocxWorker(){
    function isUsable(u){
      if (!u) return false;
      try {
        var p = new URL(u);
        if (p.protocol !== 'https:') return false;
        if (p.hostname === location.hostname) return false;
        if (/\.pages\.dev$/i.test(p.hostname)) return false;
        return true;
      } catch(_) { return false; }
    }
    try {
      var v = localStorage.getItem('docxWorkerUrl') || localStorage.getItem('antcv:docxWorker') || localStorage.getItem('antcvDocxWorker') || '';
      if (v && v.charAt(0)=='"' && v.charAt(v.length-1)=='"') v = v.slice(1,-1);
      v = (v || '').replace(/\/+$/, '');
      if (!v) v = 'https://docx-worker.karp-gabriel-a.workers.dev';
      if (isUsable(v)) {
        window.ANTCV_DOCX_WORKER = v;
        try { localStorage.setItem('docxWorkerUrl', v); localStorage.setItem('antcvDocxWorker', JSON.stringify(v)); localStorage.setItem('antcv:docxWorker', v); } catch(_) {}
      }
    } catch(_) {}
  })();
</script>

<script>
  (function bootAntCV() {
    function loadAppScripts(){
      var shapeGuard = document.createElement('script');
      shapeGuard.src = 'antcv-shape-guard.js?v=1.40.202';
      shapeGuard.onload = function(){
        var auth = document.createElement('script');
        auth.src = 'antcv-auth.js?v=1.40.202';
        auth.onload = function(){
          var app = document.createElement('script');
          app.src = 'app.js?v=1.40.340-watermark';
          app.onload = function(){
            var vo = document.createElement('script');
            vo.src = 'antcv-version-override.js?v=1.40.340-watermark';
            document.head.appendChild(vo);
          };
          document.head.appendChild(app);
        };
        document.head.appendChild(auth);
      };
      document.head.appendChild(shapeGuard);
    }

    fetch('relay-config.json', { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('HTTP_'+r.status); return r.json(); })
      .then(function(j){
        var raw = (j && typeof j.relay === 'string') ? j.relay.trim().replace(/\/+$/, '') : '';
        if (raw && raw.indexOf('https://') === 0 && raw.indexOf('REPLACE_WITH_YOUR') < 0) {
          window.ANTCV_RELAY_URL = raw;
        } else {
          window.ANTCV_RELAY_CONFIG_ERROR = 'invalid_relay_in_config';
          console.error('[AntCV admin] relay-config.json has no valid "relay" URL.');
        }
      })
      .catch(function(e){
        window.ANTCV_RELAY_CONFIG_ERROR = String((e && e.message) || e);
        console.error('[AntCV admin] relay-config.json could not be loaded:', e);
      })
      .finally(loadAppScripts);
  })();
</script>
<script>
(function(){
  async function clearAntcvHardReset(opts){
    opts=opts||{};
    var keepProxy='';
    try{ keepProxy=localStorage.getItem('proxyUrl')||''; }catch(e){}
    try{ localStorage.clear(); }catch(e){}
    try{ localStorage.removeItem('session'); localStorage.removeItem('antcv:auth:token'); localStorage.removeItem('antcv:auth:email'); localStorage.removeItem('antcv:auth:expires_at'); }catch(e){}
    try{ if(keepProxy) localStorage.setItem('proxyUrl', keepProxy); }catch(e){}
    try{ sessionStorage.clear(); }catch(e){}
    try{
      document.cookie.split(';').forEach(function(c){
        var name=c.replace(/^ +/,'').split('=')[0];
        if(!name) return;
        document.cookie=name+'=;expires='+new Date(0).toUTCString()+';path=/';
        document.cookie=name+'=;expires='+new Date(0).toUTCString()+';path=/;SameSite=None;Secure';
      });
    }catch(e){}
    try{
      if('caches' in window){
        var keys=await caches.keys();
        await Promise.all(keys.map(function(k){return caches.delete(k)}));
      }
    }catch(e){}
    try{
      if('serviceWorker' in navigator){
        var regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(function(r){return r.unregister()}));
      }
    }catch(e){}
    if(opts.redirect!==false){
      try{
        var clean=location.origin+location.pathname;
        if(opts.target){
          try{ clean=String(opts.target).replace(/[?#].*$/,''); }catch(e){}
        }
        if(clean!==location.href){
          location.replace(clean);
        }else{
          location.reload();
        }
      }catch(e){ try{ location.reload(); }catch(_){} }
    }
  }
  window.AntcvHardReset=clearAntcvHardReset;

  async function antcvFullErase(){
    try{ sessionStorage.setItem('antcv:just-erased', String(Date.now())); }catch(e){}
    var proxyUrl='';
    try{ proxyUrl=localStorage.getItem('proxyUrl')||''; if(proxyUrl.startsWith('"')&&proxyUrl.endsWith('"'))proxyUrl=proxyUrl.slice(1,-1); }catch(e){}

    if(proxyUrl){
      var base=proxyUrl.replace(/\/+$/,'');
      var withTimeout=function(p,ms){
        return Promise.race([p,new Promise(function(res){setTimeout(function(){res({_timeout:true})},ms)})]);
      };
      var EMPTY_STATE={
        proxyUrl:'',
        photo:'',
        apiKeys:{anthropic:'',openai:'',mistral:'',gemini:''},
        personalInfo:{
          name:'',firstName:'',lastName:'',headline:'',
          city:'',country:'',location:'',citizenship:'',
          email:'',phone:'',landline:'',linkedin:'',github:'',website:'',
          contactExtra:[],patentNumber:'',patentDescription:'',
          publications:[],background:'',
          tools:[],certifications:[],education:[],regulatory:[],additional:[],
          stylePrefs:{banned_words:'',banned_phrases:'',preferred_tone:''}
        },
        sections:{cv:[],cl:[]},
        meta:{},
        rationale:{},
        headerItemLoc:{},
        wizardCompleted:false,
        memoryDigest:'',
        memoryDigestHash:'',
        profileDoc:'',
        skillsDoc:'',
        danishDoc:'',
        wordsDoc:'',
        _erasedAt:new Date().toISOString()
      };
      try{
        await withTimeout(
          fetch(base+'/api/prefs',{method:'DELETE',credentials:'include'}).catch(function(e){return{_err:e}}),
          2000
        );
      }catch(e){}
      try{
        await withTimeout(
          fetch(base+'/api/prefs',{
            method:'PUT',credentials:'include',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify(EMPTY_STATE)
          }).catch(function(){return null}),
          2000
        );
      }catch(e){}
      try{
        await withTimeout(
          fetch(base+'/auth/logout',{method:'POST',credentials:'include'}).catch(function(){return null}),
          2000
        );
      }catch(e){}
      try{
        await withTimeout(
          fetch(base+'/api/profile/kernel',{method:'DELETE',credentials:'include'}).catch(function(){return null}),
          2000
        );
      }catch(e){}
    }

    try{ localStorage.clear(); }catch(e){}
    try{ sessionStorage.clear(); }catch(e){}
    try{ sessionStorage.setItem('antcv:just-erased', String(Date.now())); }catch(e){}
    try{
      document.cookie.split(';').forEach(function(c){
        var name=c.replace(/^ +/,'').split('=')[0];
        if(!name) return;
        document.cookie=name+'=;expires='+new Date(0).toUTCString()+';path=/';
        document.cookie=name+'=;expires='+new Date(0).toUTCString()+';path=/;SameSite=None;Secure';
        try{
          var domain=location.hostname.split('.').slice(-2).join('.');
          document.cookie=name+'=;expires='+new Date(0).toUTCString()+';path=/;domain=.'+domain;
        }catch(_){}
      });
    }catch(e){}
    try{
      if('caches' in window){
        var keys=await caches.keys();
        await Promise.all(keys.map(function(k){return caches.delete(k)}));
      }
    }catch(e){}
    try{
      if('serviceWorker' in navigator){
        var regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(function(r){return r.unregister()}));
      }
    }catch(e){}
    await new Promise(function(r){setTimeout(r,150)});
    try{ location.reload(); }catch(e){ try{ location.replace(location.origin+location.pathname); }catch(_){} }
  }
  window.AntcvFullErase=antcvFullErase;
  try{
    var p=new URLSearchParams(location.search);
    if(p.get('hardReset')=='1'){
      clearAntcvHardReset({target:location.origin+location.pathname});
    }
  }catch(e){}
})();
</script>
