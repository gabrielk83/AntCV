# cv-proxy — full wrangler.toml
# =============================
# Sits behind Cloudflare Access. The relay (antcv-access-relay) reaches it via
# a service token. Don't make this Worker public — its env holds the provider
# API keys.
#
# What the cv-proxy code reads from `env`:
#   Vars:        ALLOWED_ORIGINS, proxy_url
#   Bindings:    ANALYTICS (KV — events), KV_BINDING (KV — prefs/signals),
#                ANT_ANALYTIC_ENGINE (Analytics Engine dataset)
#   Secrets:     Claude_API_Key, ChatGPT_API_Key, Mistral_API_Key, Gemini_API_Key,
#                ANALYTICS_SECRET (optional — gates /analytics/summary)

name = "antcv-demo-proxy"
main = "src/index.js"
compatibility_date = "2024-12-01"

# ---------- Observability ----------
# Per AntCV standing rule: every Cloudflare Worker must emit logs into
# the dashboard. Without [observability.logs] enabled, console.log() and
# console.warn() output is invisible in `wrangler tail` and the dashboard
# Logs panel, making post-incident debugging much harder. Cost is
# negligible (logs are sampled and metered separately).
[observability.logs]
enabled = true
invocation_logs = true

# ---------- Vars ----------

[vars]
# CORS allowlist — comma-separated. Must include the PWA origin AND the
# relay's origin (since the relay forwards requests with the original Origin
# header).
DEMO_MODE = "true"
ALLOWED_ORIGINS = "https://antcv.pages.dev,https://antcv-access-relay.karp-gabriel-a.workers.dev"

# Self-reported URL returned by /config.
proxy_url = "https://antcv-demo-proxy.karp-gabriel-a.workers.dev"
# GEN-MODELROLE-001 (owner 2026-06-13): role -> provider map. Assignments
# are a COST-QUALITY decision, not taste: writer = strongest prose model,
# supervisor = cheap structured-JSON model from a DIFFERENT family (other
# blind spots), coherence = large-context model. Revisit from llm_calls /
# writing-engine telemetry. Absent or invalid -> pre-feature behaviour.
# SCE retries stay on the writer (owner decision 2).
MODEL_ROLES = '{"writer":"anthropic","supervisor":"mistral","coherence":"anthropic"}'

# ---------- KV namespaces ----------
# The code reads two binding names: ANALYTICS (for /analytics events and the
# /analytics/summary listing) and KV_BINDING (for /preferences and /signals).
# These can point at the SAME namespace id — that's the simplest setup. Or
# two separate namespaces if you want event data isolated from user data.
#
# Create namespaces:
#   npx wrangler kv:namespace create "CV_PROXY_DATA"
# (Optional second one):
#   npx wrangler kv:namespace create "CV_PROXY_ANALYTICS"
#
# Then paste the id(s) below. Two-binding-one-namespace example:


[[kv_namespaces]]
binding = "KV_BINDING"
id = "4524070751e04a30834b7ee46df98e2e"


 [[kv_namespaces]]
binding = "CV_DEMO_PROXY_DATA"
id = "bbe0fe7830224b07936690a279cefc84"



# ---------- Analytics Engine ----------

[[analytics_engine_datasets]]
binding = "ANT_ANALYTIC_ENGINE"
dataset = "ant_analytic_events"

# ---------- Secrets to set via `npx wrangler secret put …` ----------
#
# Provider API keys (only set the ones you actually use):
#   npx wrangler secret put Claude_API_Key       # must start with sk-ant-
#   npx wrangler secret put ChatGPT_API_Key      # must start with sk-
#   npx wrangler secret put Mistral_API_Key
#   npx wrangler secret put Gemini_API_Key
#
# Optional admin secret for /analytics/summary (the listing endpoint
# requires `?secret=…` to match):
#   npx wrangler secret put ANALYTICS_SECRET
#
# Verify what's set:
#   npx wrangler secret list


# --- Shared analytics KV ---
# Create once:
#   npx wrangler kv namespace create ANALYTICS
# Paste the SAME id into all AntCV workers."
[[kv_namespaces]]
binding = "ANALYTICS"
id = "1cfec90c37c043c9a03d7db32df178ba"

# ---------- Scheduled triggers ----------
# Daily model-freshness check (06:00 UTC): lists provider models and logs when a
# pinned default is retired or a newer generation appears. See scheduled() in
# src/index.js. Log-only — no runtime behaviour change.
[triggers]
crons = ["0 6 * * *"]
