name = "docx-worker"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# v1.40.135 — observability.logs added per Gabriel's repository rule:
# every wrangler.toml must enable invocation logs so console output is
# visible in the dashboard. Cost is negligible.
[observability.logs]
enabled = true
invocation_logs = true

# docx-js needs nodejs_compat for Buffer / Stream polyfills.
# Without this flag, Packer.toBuffer() throws on first call.

# 1.50.248 DOCX-EXPORT-CORS-CPU-001 mitigation: smart placement.
# Cloudflare can route the worker closer to its dependencies (and for
# CPU-bound workers, can reduce cold-start jitter). The practical effect
# for docx packing is less wall-clock spent on cross-region latency,
# leaving more headroom under the per-request CPU cap.
[placement]
mode = "smart"

[vars]
# Only allow the AntCV Pages frontend origin. Override per environment if needed.
ALLOWED_ORIGINS = "https://antcv.pages.dev"
SETUP_URL = "https://antcv.pages.dev"

[env.production]
name = "docx-worker"
vars = { ALLOWED_ORIGINS = "https://antcv.pages.dev", SETUP_URL = "https://antcv.pages.dev" }

[env.staging]
name = "docx-worker-staging"
vars = { ALLOWED_ORIGINS = "https://antcv.pages.dev", SETUP_URL = "https://antcv.pages.dev" }

# Secrets (set via `wrangler secret put`):
#   WORKER_SECRET   — optional shared secret. If set, requests must
#                     include header  X-AntCV-Secret: <value>
#
# That's it. No LLM keys here — keep those in the existing
# cloudflare-worker.js (the LLM proxy).

# --- Shared analytics KV ---
# Create once:
#   npx wrangler kv namespace create ANALYTICS
# Paste the SAME id into all AntCV workers.
[[kv_namespaces]]
binding = "ANALYTICS"
id = "1cfec90c37c043c9a03d7db32df178ba"
